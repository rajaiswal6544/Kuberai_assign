services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gold
      POSTGRES_PASSWORD: gold
      POSTGRES_DB: gold
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold -d gold"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://gold:gold@db:5432/gold
    ports:
      - "8000:8000"
    volumes:
      # Source is bind-mounted so tests see edits without a rebuild; logs land in ./logs.
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
